# ─────────────────────────────────────────────────────────
# Portfolio 인프라 — nginx + 공용 DB
# ─────────────────────────────────────────────────────────

services:

  # ── 공용 PostgreSQL (모든 프로젝트 DB 통합) ──────────────
  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - portfolio-net
    restart: always

  # ── 중앙 Nginx (포트 80/443 전담) ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../certs:/etc/certs:ro
      - ../main:/usr/share/nginx/html
      - ../jewelpro/frontend/dist:/usr/share/nginx/jewelpro-app
      - ../jewelpro:/usr/share/nginx/jewelry:ro
      - ../malbeot2/frontend/dist:/usr/share/nginx/malbeot
      - ../chocolate/frontend:/usr/share/nginx/chocolate
      - ../jbpro/frontend:/usr/share/nginx/jbpro
    networks:
      - portfolio-net
    restart: always

  # ── Chocolate API ─────────────────────────────────────────
  chocolate-api:
    build: ../chocolate/backend
    container_name: chocolate-api
    restart: unless-stopped
    env_file: ../chocolate/backend/.env
    expose:
      - "8000"
    networks:
      - portfolio-net

networks:
  portfolio-net:
    external: true

volumes:
  postgres_data:
